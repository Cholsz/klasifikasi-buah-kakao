<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cacao Disease Classifier{% endblock %}</title>
    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Style Proyek -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Navigasi Bar (Navbar) -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="bi bi-virus2 text-success"></i> Cacao Classifier
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('index') }}">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/detect' %}active{% endif %}" href="{{ url_for('detect') }}">Klasifikasi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/about' %}active{% endif %}" href="{{ url_for('about') }}">Tentang</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/guide' %}active{% endif %}" href="{{ url_for('guide') }}">Cara Penggunaan</a>
                    </li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <a href="{{ url_for('detect') }}" class="btn btn-success rounded-pill px-4 text-white fw-medium bg-success border-0" style="background-color: var(--primary-color) !important;">Mulai Deteksi</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Tempat Penyuntikan Konten Dinamis Halaman Anak -->
    <div class="flex-grow-1">
        {% block content %}{% endblock %}
    </div>

    <!-- Kotak Footer -->
    <footer>
        <div class="container text-center">
            <p class="footer-text">
                &copy; 2026 Sistem Klasifikasi Penyakit Buah Kakao CNN Berbasis Web. Tugas Akhir / Skripsi.
            </p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Javascript Utama -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
